name: Build dwrean.TV TEST v4 original player + 57 channels

on:
  push:
    branches:
      - 'test/full-channel-fallback'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Validate minimal fix only
        shell: pwsh
        run: |
          $snapshot = Get-Content -LiteralPath 'src/DwreanTv/Data/default-greece.md' -Raw
          $rows = [regex]::Matches($snapshot, '(?m)^\|\s*\d+\s*\|.*?\[>\]\(https?://')
          Write-Host "Embedded channel rows: $($rows.Count)"
          if ($rows.Count -ne 57) {
            throw "Expected exactly 57 embedded channels, found $($rows.Count)."
          }

          $mainForm = Get-Content -LiteralPath 'src/DwreanTv/MainForm.cs' -Raw
          if (-not $mainForm.Contains('new Media(_libVlc, new Uri(channel.Url))')) {
            throw 'Original direct channel.Url playback is not present.'
          }
          if ($mainForm.Contains('HlsProxyService')) {
            throw 'MainForm must not use the HLS proxy.'
          }
          if ($mainForm.Contains('GetPlaybackCandidates')) {
            throw 'MainForm must not use alternate playback candidates.'
          }

          Write-Host 'OK: original player is untouched; only the complete local channel list is used for startup.'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DwreanTv/DwreanTv.csproj

      - name: Publish TEST portable build
        run: dotnet publish src/DwreanTv/DwreanTv.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Remove unused VLC architectures
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force publish\libvlc\win-x86 -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force publish\libvlc\win-arm64 -ErrorAction SilentlyContinue

      - name: Create TEST ZIP
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath dwrean-tv-TEST-v4-original-player-full57-win-x64.zip -Force

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwrean-tv-TEST-v4-original-player-full57-win-x64
          path: dwrean-tv-TEST-v4-original-player-full57-win-x64.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish isolated TEST prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test-full57-v4 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete test-full57-v4 --cleanup-tag -y
          }
          gh release create test-full57-v4 dwrean-tv-TEST-v4-original-player-full57-win-x64.zip --target "${{ github.sha }}" --title "dwrean.TV TEST v4 - original player + 57 channels" --notes "TEST only. The LibVLC playback code is exactly the original direct channel.Url logic. No proxy, no alternate streams, no ERT patching. The only functional change is that a complete 57-channel list is bundled locally so startup does not depend on raw.githubusercontent.com."
          gh release edit test-full57-v4 --prerelease

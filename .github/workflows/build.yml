name: Build portable Windows app

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DwreanTv/DwreanTv.csproj

      - name: Publish portable build
        run: dotnet publish src/DwreanTv/DwreanTv.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Remove unused VLC architectures
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force publish\libvlc\win-x86 -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force publish\libvlc\win-arm64 -ErrorAction SilentlyContinue

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: dwrean-tv-v0.2.0-portable-win-x64
          path: publish
          if-no-files-found: error
          compression-level: 9

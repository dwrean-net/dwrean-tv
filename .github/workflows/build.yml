name: Build verbatim Free-TV test

on:
  push:
    branches: [ webview-player-test ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DwreanTv/DwreanTv.csproj

      - name: Publish test build
        run: dotnet publish src/DwreanTv/DwreanTv.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Bundle exact Free-TV Greece list
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish\data | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Free-TV/IPTV/master/lists/greece.md" -OutFile "publish\data\greece.md" -UseBasicParsing
          if (-not (Test-Path "publish\data\greece.md")) { throw "greece.md was not downloaded" }
          if ((Get-Item "publish\data\greece.md").Length -lt 1000) { throw "greece.md looks invalid" }

      - name: Remove unused VLC architectures
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force publish\libvlc\win-x86 -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force publish\libvlc\win-arm64 -ErrorAction SilentlyContinue

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwrean-tv-verbatim-free-tv-test-win-x64
          path: publish
          if-no-files-found: error
          compression-level: 9

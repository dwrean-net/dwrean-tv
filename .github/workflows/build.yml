name: Build and release Windows app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DwreanTv/DwreanTv.csproj

      - name: Publish portable build
        run: dotnet publish src/DwreanTv/DwreanTv.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Bundle Free-TV Greece list
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish\data | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Free-TV/IPTV/master/lists/greece.md" -OutFile "publish\data\greece.md" -UseBasicParsing
          if (-not (Test-Path "publish\data\greece.md")) { throw "greece.md was not downloaded" }
          if ((Get-Item "publish\data\greece.md").Length -lt 1000) { throw "greece.md looks invalid" }

      - name: Bundle mpv playback engine
        shell: pwsh
        run: |
          $mpvUrl = "https://github.com/zhongfly/mpv-winbuild/releases/download/2026-08-31-02a595ddc1/mpv-x86_64-20260831-git-02a595ddc1.7z"
          Invoke-WebRequest -Uri $mpvUrl -OutFile "mpv.7z" -UseBasicParsing
          if ((Get-Item "mpv.7z").Length -lt 1000000) { throw "mpv archive looks invalid" }
          New-Item -ItemType Directory -Force -Path "mpv-extract" | Out-Null
          7z x "mpv.7z" -o"mpv-extract" -y | Out-Null
          $mpv = Get-ChildItem "mpv-extract" -Recurse -Filter "mpv.exe" | Select-Object -First 1
          if (-not $mpv) { throw "mpv.exe not found after extraction" }
          New-Item -ItemType Directory -Force -Path "publish\player" | Out-Null
          Copy-Item "$($mpv.Directory.FullName)\*" "publish\player\" -Recurse -Force
          if (-not (Test-Path "publish\player\mpv.exe")) { throw "mpv.exe was not bundled" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath dwrean-tv-v0.3.1-portable-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwrean-tv-v0.3.1-portable-win-x64
          path: publish
          if-no-files-found: error
          compression-level: 9

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.3.1 dwrean-tv-v0.3.1-portable-win-x64.zip --clobber
          }
          else {
            gh release create v0.3.1 dwrean-tv-v0.3.1-portable-win-x64.zip --target "${{ github.sha }}" --title "dwrean Ελληνική Τηλεόραση v0.3.1" --notes "Σταθερή έκδοση με καθαρό mpv-only playback, ομαλότερη εναλλαγή καναλιών και μικρότερο πακέτο χωρίς περιττές VLC εξαρτήσεις. Portable για Windows 10/11 64-bit." --latest
          }

name: Test ERT streams

on:
  push:
    branches:
      - 'test/ert-stream-probe'
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe candidate streams
        shell: pwsh
        run: |
          $streams = [ordered]@{
            'ERTWorld-current' = 'https://ert-ucdn.broadpeak-aas.com/bpk-tv/ERTWorld/default/index.mpd'
            'ERTSports1-current' = 'https://ert-ucdn.broadpeak-aas.com/bpk-tv/ERTSports1/default/index.mpd'
            'ERTSports2-current' = 'https://ert-ucdn.broadpeak-aas.com/bpk-tv/ERTSports2/default/index.mpd'
            'ERTSports3-current' = 'https://ert-ucdn.broadpeak-aas.com/bpk-tv/ERTSports3/default/index.mpd'
            'ERTSports4-current' = 'https://ert-ucdn.broadpeak-aas.com/bpk-tv/ERTSports4/default/index.mpd'
            'ERTKids-current' = 'https://ert-ucdn.broadpeak-aas.com/bpk-tv/ERTKids/default/index.mpd'
          }

          foreach ($item in $streams.GetEnumerator()) {
            $file = Join-Path $env:RUNNER_TEMP (($item.Key -replace '[^a-zA-Z0-9_-]', '_') + '.txt')
            Write-Host "=== $($item.Key) ==="
            & curl.exe -L --fail --silent --show-error --max-time 15 --connect-timeout 8 --range 0-65535 -A 'VLC/3.0 dwrean.TV-test' $item.Value -o $file
            if ($LASTEXITCODE -ne 0) {
              Write-Host "RESULT: FAIL (curl exit $LASTEXITCODE)"
              continue
            }
            $text = Get-Content -LiteralPath $file -Raw -ErrorAction SilentlyContinue
            $size = (Get-Item $file).Length
            if ($text -match '#EXTM3U') { Write-Host "RESULT: OK HLS ($size bytes)" }
            elseif ($text -match '<MPD' -or $text -match 'urn:mpeg:dash:schema:mpd') { Write-Host "RESULT: OK DASH ($size bytes)" }
            else { Write-Host "RESULT: UNKNOWN RESPONSE ($size bytes)" }
          }
          exit 0

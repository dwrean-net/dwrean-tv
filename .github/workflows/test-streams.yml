name: Test ERT streams

on:
  push:
    branches:
      - 'test/ert-stream-probe'
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe candidate streams
        shell: pwsh
        run: |
          $streams = [ordered]@{
            'ERT1-current-mpd' = 'https://ert-live.siliconweb.com/bpk-tv/ERT1/default/index.mpd'
            'ERT2-current-mpd' = 'https://ert-live.siliconweb.com/bpk-tv/ERT2/default/index.mpd'
            'ERT3-current-mpd' = 'https://ert-live.siliconweb.com/bpk-tv/ERT3/default/index.mpd'
            'ERTNews-current-mpd' = 'https://ert-live.siliconweb.com/bpk-tv/ERTNews/default/index.mpd'
            'ERT1-ascdn-mpd' = 'https://ertflix.ascdn.broadpeak.io/ertlive/ert1/default/index.mpd'
            'ERT2-ascdn-mpd' = 'https://ertflix.ascdn.broadpeak.io/ert2/default/index.mpd'
            'ERT3-ascdn-mpd' = 'https://ertflix.ascdn.broadpeak.io/ertlive/ert3/default/index.mpd'
            'ERTNews-ascdn-hls' = 'https://ertflix.ascdn.broadpeak.io/ertlive/ertnews/default/index.m3u8'
            'ERTWorld-new-hls' = 'https://ertflix-ertworld.siliconweb.com/mpegts/618618_3479286/master_mpegts.m3u8'
            'ERTSports1-new-mpd' = 'https://ertflix-ertsports1.siliconweb.com/cmaf/618618_3479292/index.mpd'
            'ERTSports4-ascdn-mpd' = 'https://ertflix.ascdn.broadpeak.io/ertlive/seasonal/default/index.mpd'
            'ERTKids-akamai-hls' = 'https://ertflix.akamaized.net/ertlive/kids/default/index.m3u8'
            'ERT1-direct-ip' = 'http://31.121.110.30:4000/play/a028/index.m3u8'
            'ERT2-direct-ip' = 'http://31.121.110.30:4000/play/a02a/index.m3u8'
            'ERT3-direct-ip' = 'http://31.121.110.30:4000/play/a029/index.m3u8'
          }

          $ok = 0
          foreach ($item in $streams.GetEnumerator()) {
            $safeName = $item.Key -replace '[^a-zA-Z0-9_-]', '_'
            $file = Join-Path $env:RUNNER_TEMP ($safeName + '.txt')
            Write-Host "=== $($item.Key) ==="
            Write-Host $item.Value
            & curl.exe -L --fail --silent --show-error --max-time 15 --connect-timeout 8 -A 'VLC/3.0 dwrean.TV-test' $item.Value -o $file
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              Write-Host "RESULT: FAIL (curl exit $code)"
              continue
            }
            $text = Get-Content -LiteralPath $file -Raw -ErrorAction SilentlyContinue
            $size = (Get-Item $file).Length
            if ($text -match '#EXTM3U') {
              Write-Host "RESULT: OK HLS ($size bytes)"
              $ok++
            }
            elseif ($text -match '<MPD' -or $text -match 'urn:mpeg:dash:schema:mpd') {
              Write-Host "RESULT: OK DASH ($size bytes)"
              $ok++
            }
            else {
              Write-Host "RESULT: RESPONSE but unknown manifest ($size bytes)"
              Write-Host ($text.Substring(0, [Math]::Min(160, $text.Length)))
            }
          }
          Write-Host "TOTAL MANIFESTS OK: $ok / $($streams.Count)"
          exit 0

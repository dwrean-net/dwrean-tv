name: Test national channel streams

on:
  push:
    branches:
      - 'test/ert-stream-probe'
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe HLS variants and segments
        shell: pwsh
        run: |
          $tests = @(
            @{ Name='STAR'; Url='https://livestar.siliconweb.com/starvod/star4/star4.m3u8'; Referer='https://www.star.gr/tv/live-stream' },
            @{ Name='ALPHA'; Url='https://alphatvlive2.siliconweb.com/alphatvlive/live_abr/playlist.m3u8'; Referer='https://www.alphatv.gr/live' },
            @{ Name='SKAI'; Url='https://skai-live.siliconweb.com/media/cambria4/index.m3u8'; Referer='https://www.skai.gr/tv/live' },
            @{ Name='OPEN'; Url='https://liveopen.siliconweb.com/openTvLive/liveopen/playlist.m3u8'; Referer='https://www.tvopen.gr/live' },
            @{ Name='ERTNews'; Url='https://ert-ucdn.broadpeak-aas.com/bpk-tv/ERTNews/default/index.m3u8'; Referer='https://www.ert.gr/tv-live/' }
          )

          $ua = 'VLC/3.0.23 LibVLC/3.0.23'

          function Get-AbsUrl([string]$baseUrl, [string]$child) {
            if ($child -match '^https?://') { return $child }
            return ([Uri]::new([Uri]$baseUrl, $child)).AbsoluteUri
          }

          function Fetch-Text([string]$url, [string]$referer, [string]$outfile) {
            & curl.exe -L --fail --silent --show-error --max-time 20 --connect-timeout 8 -A $ua -e $referer $url -o $outfile
            return ($LASTEXITCODE -eq 0)
          }

          foreach ($t in $tests) {
            Write-Host "`n================ $($t.Name) ================"
            $masterFile = Join-Path $env:RUNNER_TEMP ($t.Name + '-master.txt')
            if (-not (Fetch-Text $t.Url $t.Referer $masterFile)) {
              Write-Host 'MASTER: FAIL'
              continue
            }
            $master = Get-Content -LiteralPath $masterFile -Raw
            Write-Host "MASTER: OK $((Get-Item $masterFile).Length) bytes"
            Write-Host '--- master manifest ---'
            Write-Host $master

            $masterLines = $master -split "`r?`n"
            $uriLines = @($masterLines | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
            if ($uriLines.Count -eq 0) {
              Write-Host 'NO URI IN MASTER'
              continue
            }

            $playlistUrl = $t.Url
            $playlist = $master
            if ($master -match '#EXT-X-STREAM-INF') {
              $playlistUrl = Get-AbsUrl $t.Url $uriLines[0]
              Write-Host "VARIANT URL: $playlistUrl"
              $variantFile = Join-Path $env:RUNNER_TEMP ($t.Name + '-variant.txt')
              if (-not (Fetch-Text $playlistUrl $t.Referer $variantFile)) {
                Write-Host 'VARIANT: FAIL'
                continue
              }
              $playlist = Get-Content -LiteralPath $variantFile -Raw
              Write-Host "VARIANT: OK $((Get-Item $variantFile).Length) bytes"
              Write-Host '--- variant manifest first lines ---'
              ($playlist -split "`r?`n" | Select-Object -First 20) | ForEach-Object { Write-Host $_ }
            }

            $playlistLines = $playlist -split "`r?`n"
            $segmentLine = $playlistLines | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') } | Select-Object -First 1
            if (-not $segmentLine) {
              Write-Host 'NO SEGMENT URI'
              continue
            }
            $segmentUrl = Get-AbsUrl $playlistUrl $segmentLine
            Write-Host "SEGMENT URL: $segmentUrl"
            $segmentFile = Join-Path $env:RUNNER_TEMP ($t.Name + '-segment.bin')
            & curl.exe -L --fail --silent --show-error --max-time 20 --connect-timeout 8 --range 0-131071 -A $ua -e $t.Referer $segmentUrl -o $segmentFile
            if ($LASTEXITCODE -ne 0) {
              Write-Host "SEGMENT: FAIL (curl exit $LASTEXITCODE)"
              continue
            }
            $segmentSize = (Get-Item $segmentFile).Length
            Write-Host "SEGMENT: OK $segmentSize bytes"
          }
          exit 0
